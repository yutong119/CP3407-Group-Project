<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SafeStay – Analysis Result</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue:       #2563EB;
    --blue-dark:  #1D4ED8;
    --blue-light: #EFF6FF;
    --red:        #DC2626;
    --red-light:  #FEF2F2;
    --amber:      #D97706;
    --amber-light:#FFFBEB;
    --green:      #16A34A;
    --gray-50:    #F9FAFB;
    --gray-100:   #F3F4F6;
    --gray-200:   #E5E7EB;
    --gray-400:   #9CA3AF;
    --gray-500:   #6B7280;
    --gray-700:   #374151;
    --gray-900:   #111827;
    --white:      #FFFFFF;
    --shadow-sm:  0 1px 3px rgba(0,0,0,.08);
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--gray-50);
    color: var(--gray-900);
    min-height: 100vh;
  }

  /* NAV */
  nav {
    background: var(--white);
    border-bottom: 1px solid var(--gray-200);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .nav-brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    font-size: 18px;
    color: var(--blue);
    text-decoration: none;
  }
  .nav-brand .shield {
    width: 28px; height: 28px;
    background: var(--blue);
    border-radius: 6px;
    display: grid; place-items: center;
    color: #fff; font-size: 14px;
  }
  .nav-lang {
    font-size: 13px;
    color: var(--gray-500);
    border: 1px solid var(--gray-200);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
  }

  /* MAIN */
  .result-wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 28px 16px 60px;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--gray-500);
    text-decoration: none;
    margin-bottom: 16px;
  }
  .back-link:hover { color: var(--blue); }

  .result-wrap h1 { font-size: 20px; font-weight: 800; margin-bottom: 20px; }

  /* DETECTED CASE */
  .detected-card {
    border: 1px solid var(--gray-200);
    border-radius: 12px;
    padding: 16px 20px;
    background: var(--white);
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    box-shadow: var(--shadow-sm);
  }
  .detected-label { font-size: 12px; color: var(--gray-500); margin-bottom: 4px; }
  .detected-type  { font-size: 24px; font-weight: 800; color: var(--blue); }
  .detected-prob  { font-size: 12px; color: var(--gray-400); margin-top: 2px; }
  .detected-icon  { font-size: 36px; }

  /* URGENCY */
  .urgency-card {
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }
  .urgency-card.high   { background: var(--red-light);   border: 1px solid #FECACA; }
  .urgency-card.medium { background: var(--amber-light); border: 1px solid #FDE68A; }
  .urgency-card.low    { background: #F0FDF4;             border: 1px solid #BBF7D0; }

  .urgency-icon { font-size: 22px; margin-top: 2px; }
  .urgency-title { font-size: 13px; font-weight: 700; margin-bottom: 6px; }

  .urgency-badge {
    font-size: 13px;
    font-weight: 700;
    padding: 3px 12px;
    border-radius: 20px;
    display: inline-block;
    margin-bottom: 6px;
  }
  .urgency-badge.high   { background: var(--red);   color: #fff; }
  .urgency-badge.medium { background: var(--amber); color: #fff; }
  .urgency-badge.low    { background: var(--green); color: #fff; }
  .urgency-desc { font-size: 13px; color: var(--gray-500); line-height: 1.5; }

  /* ACTIONS */
  .actions-card {
    background: var(--white);
    border: 1px solid var(--gray-200);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: var(--shadow-sm);
  }
  .actions-card h3 { font-size: 14px; font-weight: 700; margin-bottom: 14px; }

  .action-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--gray-100);
  }
  .action-item:last-child { border-bottom: none; padding-bottom: 0; }
  .action-num {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--blue);
    color: var(--white);
    font-size: 12px;
    font-weight: 700;
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .action-text { font-size: 13px; color: var(--gray-700); line-height: 1.5; padding-top: 3px; }

  /* BUTTONS */
  .result-btns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .btn-result {
    padding: 13px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    font-family: inherit;
    text-align: center;
    transition: opacity .15s, transform .1s;
  }
  .btn-result:active { transform: scale(.97); }
  .btn-result:hover  { opacity: .88; }
  .btn-result.outline {
    background: var(--white);
    border: 1px solid var(--gray-200);
    color: var(--gray-700);
  }
  .btn-result.primary {
    background: var(--blue);
    color: var(--white);
  }

  .btn-back {
    width: 100%;
    padding: 13px;
    background: var(--white);
    border: 1px solid var(--gray-200);
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    color: var(--gray-700);
    cursor: pointer;
    font-family: inherit;
    text-align: center;
    text-decoration: none;
    display: block;
    transition: background .15s;
  }
  .btn-back:hover { background: var(--gray-50); }
</style>
</head>
<body>

<nav>
  <a class="nav-brand" href="index.html">
    <div class="shield">🛡</div>
    SafeStay
  </a>
  <div class="nav-lang" id="nav-lang" onclick="location.href='language.html?return_to=' + encodeURIComponent('result.html' + window.location.search)">🌐 <span id="nav-lang-text">English</span> ▾</div>
  <script>
    (function () {
      var saved = localStorage.getItem('safestay_preferred_language');
      if (saved) document.getElementById('nav-lang-text').textContent = saved;
    })();
  </script>
</nav>

<div class="result-wrap">

  <a class="back-link" href="describe.html">← Edit description</a>

  <h1>Analysis Result</h1>

  <!-- Detected Case -->
  <div class="detected-card">
    <div>
      <div class="detected-label">Detected Case</div>
      <div class="detected-type" id="detected-type">Loading…</div>
      <div class="detected-prob" id="detected-prob">&nbsp;</div>
    </div>
    <div class="detected-icon" id="detected-icon">⏳</div>
  </div>

  <!-- Urgency Level -->
  <div class="urgency-card medium" id="urgency-card">
    <div class="urgency-icon">⏳</div>
    <div>
      <div class="urgency-title">Urgency Level</div>
      <span class="urgency-badge medium" id="urgency-badge">Loading…</span>
      <p class="urgency-desc" id="urgency-desc">Fetching the analysis for this case…</p>
    </div>
  </div>

  <!-- Error banner (hidden unless something goes wrong) -->
  <div id="error-banner" style="display:none; background:var(--red-light); border:1px solid #FECACA; color:var(--red); border-radius:10px; padding:12px 16px; font-size:13px; margin-bottom:14px;"></div>

  <!-- Recommended Actions -->
  <div class="actions-card">
    <h3>Recommended Actions</h3>
    <div class="action-item">
      <div class="action-num">•</div>
      <div class="action-text">Loading recommended actions…</div>
    </div>
  </div>

  <!-- CTA Buttons -->
  <div class="result-btns">
    <button class="btn-result outline" id="checklist-btn">📋 View Checklist</button>
    <button class="btn-result primary" id="contacts-btn">📞 View Contacts</button>
  </div>

  <a class="btn-back" href="#" id="case-details-btn" style="margin-bottom:10px">📁 View Full Case Details</a>

  <a class="btn-back" href="index.html">← Back to Home</a>

</div>

<script src="api.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const caseId = params.get('case_id');
  const query  = caseId ? '?case_id=' + encodeURIComponent(caseId) : '';

  document.getElementById('checklist-btn').addEventListener('click', () => {
    window.location.href = 'evidence.html' + query;
  });
  document.getElementById('contacts-btn').addEventListener('click', () => {
    window.location.href = 'contacts.html' + query;
  });
  document.getElementById('case-details-btn').addEventListener('click', (e) => {
    e.preventDefault();
    window.location.href = 'case-details.html' + query;
  });

  const GENERIC_ACTIONS = [
    'Contact the police or campus security if you feel unsafe',
    'Write down everything you remember while it is fresh',
    'Gather any evidence related to the incident',
    'Reach out to a trusted contact or support office',
    'Follow up using the checklist and contacts for this case type'
  ];

  const CASE_ICONS = {
    theft: '🛍️', harassment: '⚠️', assault: '🚨', fraud: '💳',
    accident: '🚑', fire: '🔥', default: '📄'
  };

  function showError(message) {
    const banner = document.getElementById('error-banner');
    banner.textContent = message;
    banner.style.display = 'block';
  }

  function renderAnalysis(caseData) {
    // Log the raw shape once so it's easy to see in devtools exactly what the backend sent
    console.log('SafeStay: case data received', caseData);

    // Tolerate a few likely key-name variants in case the backend doesn't use snake_case
    const detectedCase =
      caseData.detected_case ?? caseData.detectedCase ?? caseData.case_type ??
      caseData.predicted_case ?? (caseData.analysis && caseData.analysis.detected_case);

    const probability =
      caseData.probability ?? caseData.confidence ??
      (caseData.analysis && caseData.analysis.probability);

    if (detectedCase) {
      document.getElementById('detected-type').textContent = detectedCase;
      const key = String(detectedCase).toLowerCase();
      document.getElementById('detected-icon').textContent = CASE_ICONS[key] || CASE_ICONS.default;
    } else {
      document.getElementById('detected-type').textContent = 'Unknown';
      showError('The server responded, but no detected case type was included in the data. Check the console for the raw response.');
    }

    if (probability != null) {
      document.getElementById('detected-prob').textContent = `Probability: ${probability}%`;
    } else {
      document.getElementById('detected-prob').textContent = '';
    }

    const urgency = (caseData.urgency_level || 'medium').toLowerCase();
    const card  = document.getElementById('urgency-card');
    const badge = document.getElementById('urgency-badge');
    const desc  = document.getElementById('urgency-desc');

    card.className  = `urgency-card ${urgency}`;
    badge.className = `urgency-badge ${urgency}`;

    if (urgency === 'high') {
      badge.textContent = '⚠ High';
      desc.textContent  = 'This situation requires immediate attention. Please act on the steps below as soon as possible.';
    } else if (urgency === 'low') {
      badge.textContent = '✓ Low';
      desc.textContent  = 'This situation is not urgent, but it\u2019s still worth following the steps below.';
    } else {
      badge.textContent = '⚠ Medium';
      desc.textContent  = 'This situation should be addressed soon. Review the recommended steps below.';
    }

    // Recommended actions — always replace the loading/placeholder list with real data,
    // falling back to a generic (non-case-specific) list only if the backend gave none.
    const actions = (Array.isArray(caseData.recommended_actions) && caseData.recommended_actions.length)
      ? caseData.recommended_actions
      : GENERIC_ACTIONS;

    const actionsCard = document.querySelector('.actions-card');
    const items = actions.map((action, i) => {
      const text = typeof action === 'string'
        ? action
        : (action.step_description || action.step_title || action.item_name || 'Recommended step');
      return `
      <div class="action-item">
        <div class="action-num">${i + 1}</div>
        <div class="action-text">${text}</div>
      </div>
    `;
    }).join('');
    actionsCard.innerHTML = '<h3>Recommended Actions</h3>' + items;
  }

  async function loadCaseResult() {
    // Prefer the fresh analysis stored right after describe.html called /api/analyze
    const cached = sessionStorage.getItem('safestay_analysis');
    let renderedFromCache = false;
    if (cached) {
      try {
        renderAnalysis(JSON.parse(cached));
        renderedFromCache = true;
      } catch (e) {
        console.warn('Bad cached analysis:', e);
      }
    }

    // Then sync with the backend — authoritative, and needed for direct/shared links
    const params = new URLSearchParams(window.location.search);
    const caseId = params.get('case_id');

    if (!caseId) {
      if (!renderedFromCache) {
        showError('No case was specified, so no analysis could be loaded. Please start again from the description page.');
      }
      return;
    }

    try {
      const response = await safeStayAPI.getCase(caseId);
      // getCase returns { success, case: {...}, analysis_data: { recommended_actions, ... } }
      // Merge both so renderAnalysis can read detected_case/urgency_level from `case`
      // and recommended_actions/evidence_checklist/etc from `analysis_data` in one object.
      const caseData = {
        ...(response.case || response || {}),
        ...(response.analysis_data || {})
      };
      renderAnalysis(caseData);
    } catch (err) {
      console.error('Failed to load case result:', err);
      if (!renderedFromCache) {
        showError(`Couldn't load this case from the server (${err.message}). Please try again.`);
      }
    }
  }
  document.addEventListener('DOMContentLoaded', loadCaseResult);
</script>

</body>
</html>

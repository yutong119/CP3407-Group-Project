<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Language – SafeStay</title>
  <script src="api.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F9FAFB;
      min-height: 100vh;
    }

    .app-wrapper {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      background: #F9FAFB;
      padding-bottom: 40px;
    }

    /* ── App bar ── */
    .appbar {
      background: #1A56DB;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .appbar-icon {
      width: 32px; height: 32px;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      text-decoration: none;
      flex-shrink: 0;
    }
    .appbar-title { color: #fff; font-weight: 700; font-size: 16px; }
    .appbar-sub   { color: rgba(255,255,255,0.75); font-size: 12px; }

    .page-header {
      background: #fff;
      padding: 20px 16px 16px;
      border-bottom: 1px solid #E5E7EB;
    }
    .page-title { font-size: 18px; font-weight: 700; color: #111827; }
    .page-sub   { font-size: 13px; color: #6B7280; margin-top: 4px; }

    /* ── Language list ── */
    .lang-list {
      margin: 16px 16px 0;
      background: #fff;
      border: 1px solid #E5E7EB;
      border-radius: 12px;
      overflow: hidden;
    }
    .lang-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid #F3F4F6;
      cursor: pointer;
    }
    .lang-row:last-child { border-bottom: none; }
    .lang-flag { font-size: 20px; width: 26px; text-align: center; flex-shrink: 0; }
    .lang-body { flex: 1; }
    .lang-name { font-size: 14px; font-weight: 600; color: #111827; }
    .lang-native { font-size: 12px; color: #6B7280; }
    .lang-check { color: #1A56DB; font-size: 16px; font-weight: 700; visibility: hidden; flex-shrink: 0; }
    .lang-row.selected .lang-check { visibility: visible; }

    .save-note {
      margin: 12px 16px 0;
      font-size: 13px; color: #057A55;
      display: none;
    }
    .error-box {
      margin: 12px 16px 0;
      background: #FDF2F2; color: #E02424;
      padding: 10px 14px; border-radius: 10px;
      font-size: 13px;
      display: none;
    }
  </style>
</head>
<body>
<div class="app-wrapper">

  <!-- App bar -->
  <div class="appbar">
    <a href="profile.html" class="appbar-icon">←</a>
    <div>
      <div class="appbar-title">SafeStay</div>
      <div class="appbar-sub">Language Support</div>
    </div>
  </div>

  <div class="page-header">
    <div class="page-title">Choose your language</div>
    <div class="page-sub">SafeStay guidance will be shown in this language where available</div>
  </div>

  <div class="lang-list" id="lang-list"></div>

  <div class="save-note" id="save-note">✓ Language preference saved</div>
  <div class="error-box" id="error-box"></div>

</div>

<script>
  const LANGUAGES = [
    { code: 'English',            flag: '🇬🇧', native: 'English' },
    { code: 'Chinese (Simplified)', flag: '🇨🇳', native: '中文（简体）' },
    { code: 'Japanese',           flag: '🇯🇵', native: '日本語' },
    { code: 'Korean',             flag: '🇰🇷', native: '한국어' },
    { code: 'Spanish',            flag: '🇪🇸', native: 'Español' },
    { code: 'Arabic',             flag: '🇸🇦', native: 'العربية' },
    { code: 'French',             flag: '🇫🇷', native: 'Français' },
  ];

  let CURRENT_LANGUAGE = 'English';
  let CURRENT_NAME = '';

  function render() {
    const list = document.getElementById('lang-list');
    list.innerHTML = LANGUAGES.map(l => `
      <div class="lang-row ${l.code === CURRENT_LANGUAGE ? 'selected' : ''}" data-code="${l.code}">
        <span class="lang-flag">${l.flag}</span>
        <div class="lang-body">
          <div class="lang-name">${l.code}</div>
          <div class="lang-native">${l.native}</div>
        </div>
        <span class="lang-check">✓</span>
      </div>
    `).join('');

    list.querySelectorAll('.lang-row').forEach(row => {
      row.addEventListener('click', () => selectLanguage(row.dataset.code));
    });
  }

  async function selectLanguage(code) {
    if (code === CURRENT_LANGUAGE) return;

    const errBox = document.getElementById('error-box');
    const note = document.getElementById('save-note');
    errBox.style.display = 'none';
    note.style.display = 'none';

    const previous = CURRENT_LANGUAGE;
    CURRENT_LANGUAGE = code;
    render();

    try {
      await safeStayAPI.updateProfile(CURRENT_NAME, code);
      note.style.display = 'block';
    } catch (err) {
      CURRENT_LANGUAGE = previous;
      render();
      errBox.textContent = 'Could not save language preference. ' + (err.message || 'Please try again.');
      errBox.style.display = 'block';
    }
  }

  async function init() {
    if (!safeStayAPI.token) {
      location.href = 'login.html';
      return;
    }

    // Read the current name + language from the backend first so we don't
    // overwrite the user's name with a blank value when saving language.
    try {
      const response = await safeStayAPI.getUserProfile();
      const profile = response.user || response;
      CURRENT_NAME = profile.full_name || profile.name || '';
      if (profile.preferred_language) {
        CURRENT_LANGUAGE = profile.preferred_language;
      }
    } catch (err) {
      console.warn('Could not load profile:', err.message);
    }

    render();
  }

  init();
</script>
</body>
</html>

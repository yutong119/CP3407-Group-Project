<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title data-i18n="pageTitles.login">SafeStay – Login / Register</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue:       #2563EB;
    --blue-dark:  #1D4ED8;
    --gray-50:    #F9FAFB;
    --gray-100:   #F3F4F6;
    --gray-200:   #E5E7EB;
    --gray-400:   #9CA3AF;
    --gray-500:   #6B7280;
    --gray-700:   #374151;
    --gray-900:   #111827;
    --white:      #FFFFFF;
    --shadow-sm:  0 1px 3px rgba(0,0,0,.08);
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--gray-50);
    color: var(--gray-900);
    min-height: 100vh;
  }

  /* NAV */
  nav {
    background: var(--white);
    border-bottom: 1px solid var(--gray-200);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .nav-brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    font-size: 18px;
    color: var(--blue);
    text-decoration: none;
  }
  .nav-brand .shield {
    width: 28px; height: 28px;
    background: var(--blue);
    border-radius: 6px;
    display: grid; place-items: center;
    color: #fff; font-size: 14px;
  }
  .nav-lang {
    font-size: 13px;
    color: var(--gray-500);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    border: 1px solid var(--gray-200);
    border-radius: 6px;
    padding: 4px 10px;
  }

  /* AUTH WRAP */
  .auth-wrap {
    max-width: 400px;
    margin: 0 auto;
    padding: 40px 16px 60px;
  }

  /* LOGO */
  .auth-logo { text-align: center; margin-bottom: 28px; }
  .auth-logo .shield-lg {
    width: 52px; height: 52px;
    background: var(--blue);
    border-radius: 14px;
    display: grid; place-items: center;
    font-size: 24px;
    color: #fff;
    margin: 0 auto 12px;
  }
  .auth-logo h1 { font-size: 22px; font-weight: 800; }
  .auth-logo p  { font-size: 14px; color: var(--gray-500); margin-top: 4px; }

  /* TABS */
  .auth-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: var(--gray-100);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 24px;
  }
  .auth-tab {
    padding: 9px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: var(--gray-500);
    border-radius: 8px;
    cursor: pointer;
    transition: all .15s;
  }
  .auth-tab.active {
    background: var(--white);
    color: var(--gray-900);
    box-shadow: var(--shadow-sm);
  }

  /* FORM */
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--gray-700);
    margin-bottom: 6px;
  }
  .form-group input {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid var(--gray-200);
    border-radius: 9px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s;
    background: var(--white);
  }
  .form-group input:focus { border-color: var(--blue); }
  .form-hint { display: flex; justify-content: flex-end; margin-top: 4px; }
  .form-hint a { font-size: 12px; color: var(--blue); text-decoration: none; }

  /* BUTTONS */
  .btn-submit {
    width: 100%;
    padding: 13px;
    background: var(--blue);
    color: var(--white);
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background .15s;
    margin-top: 4px;
  }
  .btn-submit:hover { background: var(--blue-dark); }

  /* DIVIDER */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
    color: var(--gray-400);
    font-size: 13px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--gray-200);
  }

  /* SOCIAL */
  .social-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 11px;
    border: 1px solid var(--gray-200);
    border-radius: 9px;
    background: var(--white);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    margin-bottom: 10px;
    font-family: inherit;
    transition: background .15s;
  }
  .social-btn:hover { background: var(--gray-50); }

  /* FOOTER */
  .auth-footer {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: var(--gray-500);
  }
  .auth-footer a { color: var(--blue); font-weight: 600; text-decoration: none; cursor: pointer; }

  /* PANELS */
  .register-panel { display: none; }
  .register-panel.active { display: block; }
  .login-panel { display: block; }
  .login-panel.hidden { display: none; }
</style>
</head>
<body>

<nav>
  <a class="nav-brand" href="index.html">
    <div class="shield">🛡</div>
    SafeStay
  </a>
  <div class="nav-lang" id="nav-lang" onclick="location.href='language.html?return_to=login.html'">🌐 <span id="nav-lang-text">English</span> ▾</div>
  <script>
    (function () {
      var saved = localStorage.getItem('safestay_preferred_language');
      var code = saved && ['en', 'zh-CN', 'ja', 'fr'].includes(saved) ? saved : 'en';
      var textEl = document.getElementById('nav-lang-text');
      if (textEl) {
        textEl.textContent = window.t ? window.t('languages.' + code) : code;
      }
    })();
  </script>
</nav>

<div class="auth-wrap">

  <div class="auth-logo">
    <div class="shield-lg">🛡️</div>
    <h1 data-i18n="login.welcomeBack">Welcome Back! 👋</h1>
    <p data-i18n="login.loginToContinue">Login to continue</p>
  </div>

  <div class="auth-tabs">
    <div class="auth-tab active" id="tab-login" onclick="switchTab('login')" data-i18n="login.login">Login</div>
    <div class="auth-tab" id="tab-register" onclick="switchTab('register')" data-i18n="login.register">Register</div>
  </div>

  <!-- LOGIN -->
  <div class="login-panel" id="login-panel">
    <div class="form-group">
      <label data-i18n="login.email">Email</label>
      <input type="email" id="login-email" placeholder="Enter your email" data-i18n-placeholder="login.enterEmail" />
    </div>
    <div class="form-group">
      <label data-i18n="login.password">Password</label>
      <input type="password" id="login-password" placeholder="Enter your password" data-i18n-placeholder="login.enterPassword" />
      <div class="form-hint"><a href="#" data-i18n="login.forgotPassword">Forgot password?</a></div>
    </div>
    <div class="form-error" id="login-error" style="display:none;color:#DC2626;font-size:13px;margin-bottom:10px;"></div>
    <button class="btn-submit" id="login-submit-btn" onclick="handleLogin()" data-i18n="login.login">Login</button>
    <div class="divider" data-i18n="login.orContinueWith">or continue with</div>
    <button class="social-btn" data-i18n="login.continueGoogle">🔵 Continue with Google</button>
    <button class="social-btn" data-i18n="login.continueApple">⚫ Continue with Apple</button>
    <div class="auth-footer">
      <span data-i18n="login.dontHaveAccount">Don't have an account?</span> <a onclick="switchTab('register')" data-i18n="login.register">Register</a>
    </div>
  </div>

  <!-- REGISTER -->
  <div class="register-panel" id="register-panel">
    <div class="form-group">
      <label data-i18n="login.fullName">Full Name</label>
      <input type="text" id="register-name" placeholder="Enter your full name" data-i18n-placeholder="login.enterFullName" />
    </div>
    <div class="form-group">
      <label data-i18n="login.email">Email</label>
      <input type="email" id="register-email" placeholder="Enter your email" data-i18n-placeholder="login.enterEmail" />
    </div>
    <div class="form-group">
      <label data-i18n="login.university">University</label>
      <input type="text" id="register-university" placeholder="e.g. James Cook University" data-i18n-placeholder="login.universityPlaceholder" />
    </div>
    <div class="form-group">
      <label data-i18n="login.password">Password</label>
      <input type="password" id="register-password" placeholder="Create a password" data-i18n-placeholder="login.createPassword" />
    </div>
    <div class="form-error" id="register-error" style="display:none;color:#DC2626;font-size:13px;margin-bottom:10px;"></div>
    <button class="btn-submit" id="register-submit-btn" onclick="handleRegister()" data-i18n="login.createAccount">Create Account</button>
    <div class="divider" data-i18n="login.orContinueWith">or continue with</div>
    <button class="social-btn" data-i18n="login.continueGoogle">🔵 Continue with Google</button>
    <div class="auth-footer">
      <span data-i18n="login.alreadyHaveAccount">Already have an account?</span> <a onclick="switchTab('login')" data-i18n="login.login">Login</a>
    </div>
  </div>

</div>

<script src="i18n.js"></script>
<script src="api.js"></script>
<script>
  async function switchTab(tab) {
    const loginPanel    = document.getElementById('login-panel');
    const registerPanel = document.getElementById('register-panel');
    const tabLogin      = document.getElementById('tab-login');
    const tabRegister   = document.getElementById('tab-register');

    if (tab === 'login') {
      loginPanel.classList.remove('hidden');
      registerPanel.classList.remove('active');
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      document.querySelector('.auth-logo h1').textContent = window.t('login.welcomeBack');
      document.querySelector('.auth-logo p').textContent  = window.t('login.loginToContinue');
    } else {
      loginPanel.classList.add('hidden');
      registerPanel.classList.add('active');
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      document.querySelector('.auth-logo h1').textContent = window.t('login.createAccountTitle');
      document.querySelector('.auth-logo p').textContent  = window.t('login.joinSafeStay');
    }
  }

  // ===== LOGIN =====
  async function handleLogin() {
    const email    = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errorEl  = document.getElementById('login-error');
    const btn      = document.getElementById('login-submit-btn');

    errorEl.style.display = 'none';

    if (!email || !password) {
      errorEl.textContent = window.t('login.enterCredentials');
      errorEl.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = window.t('login.loggingIn');

    try {
      await safeStayAPI.login(email, password);
      location.href = 'describe.html';
    } catch (err) {
      errorEl.textContent = err.message || window.t('login.loginFailed');
      errorEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = window.t('login.login');
    }
  }

  // ===== REGISTER =====
  async function handleRegister() {
    const fullName = document.getElementById('register-name').value.trim();
    const email    = document.getElementById('register-email').value.trim();
    const password = document.getElementById('register-password').value;
    // Note: api.js's register() does not currently accept a university field,
    // so it's collected here but not sent. Add it to api.js + backend if needed.
    const errorEl  = document.getElementById('register-error');
    const btn      = document.getElementById('register-submit-btn');

    errorEl.style.display = 'none';

    if (!fullName || !email || !password) {
      errorEl.textContent = window.t('login.fillRequired');
      errorEl.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = window.t('login.creatingAccount');

    try {
      await safeStayAPI.register(email, password, fullName);
      await safeStayAPI.login(email, password); // auto-login right after signup
      location.href = 'describe.html';
    } catch (err) {
      errorEl.textContent = err.message || window.t('login.registrationFailed');
      errorEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = window.t('login.createAccount');
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    window.initI18n();
  });
</script>
</body>
</html>

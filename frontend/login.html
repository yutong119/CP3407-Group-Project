<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SafeStay – Login / Register</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue:       #2563EB;
    --blue-dark:  #1D4ED8;
    --gray-50:    #F9FAFB;
    --gray-100:   #F3F4F6;
    --gray-200:   #E5E7EB;
    --gray-400:   #9CA3AF;
    --gray-500:   #6B7280;
    --gray-700:   #374151;
    --gray-900:   #111827;
    --white:      #FFFFFF;
    --shadow-sm:  0 1px 3px rgba(0,0,0,.08);
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--gray-50);
    color: var(--gray-900);
    min-height: 100vh;
  }

  /* NAV */
  nav {
    background: var(--white);
    border-bottom: 1px solid var(--gray-200);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .nav-brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    font-size: 18px;
    color: var(--blue);
    text-decoration: none;
  }
  .nav-brand .shield {
    width: 28px; height: 28px;
    background: var(--blue);
    border-radius: 6px;
    display: grid; place-items: center;
    color: #fff; font-size: 14px;
  }
  .nav-lang {
    font-size: 13px;
    color: var(--gray-500);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    border: 1px solid var(--gray-200);
    border-radius: 6px;
    padding: 4px 10px;
  }

  /* AUTH WRAP */
  .auth-wrap {
    max-width: 400px;
    margin: 0 auto;
    padding: 40px 16px 60px;
  }

  /* LOGO */
  .auth-logo { text-align: center; margin-bottom: 28px; }
  .auth-logo .shield-lg {
    width: 52px; height: 52px;
    background: var(--blue);
    border-radius: 14px;
    display: grid; place-items: center;
    font-size: 24px;
    color: #fff;
    margin: 0 auto 12px;
  }
  .auth-logo h1 { font-size: 22px; font-weight: 800; }
  .auth-logo p  { font-size: 14px; color: var(--gray-500); margin-top: 4px; }

  /* TABS */
  .auth-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: var(--gray-100);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 24px;
  }
  .auth-tab {
    padding: 9px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: var(--gray-500);
    border-radius: 8px;
    cursor: pointer;
    transition: all .15s;
  }
  .auth-tab.active {
    background: var(--white);
    color: var(--gray-900);
    box-shadow: var(--shadow-sm);
  }

  /* FORM */
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--gray-700);
    margin-bottom: 6px;
  }
  .form-group input {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid var(--gray-200);
    border-radius: 9px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s;
    background: var(--white);
  }
  .form-group input:focus { border-color: var(--blue); }
  .form-hint { display: flex; justify-content: flex-end; margin-top: 4px; }
  .form-hint a { font-size: 12px; color: var(--blue); text-decoration: none; }

  /* BUTTONS */
  .btn-submit {
    width: 100%;
    padding: 13px;
    background: var(--blue);
    color: var(--white);
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background .15s;
    margin-top: 4px;
  }
  .btn-submit:hover { background: var(--blue-dark); }

  /* DIVIDER */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
    color: var(--gray-400);
    font-size: 13px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--gray-200);
  }

  /* SOCIAL */
  .social-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 11px;
    border: 1px solid var(--gray-200);
    border-radius: 9px;
    background: var(--white);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    margin-bottom: 10px;
    font-family: inherit;
    transition: background .15s;
  }
  .social-btn:hover { background: var(--gray-50); }

  /* FOOTER */
  .auth-footer {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: var(--gray-500);
  }
  .auth-footer a { color: var(--blue); font-weight: 600; text-decoration: none; cursor: pointer; }

  /* PANELS */
  .register-panel { display: none; }
  .register-panel.active { display: block; }
  .login-panel { display: block; }
  .login-panel.hidden { display: none; }
</style>
</head>
<body>

<nav>
  <a class="nav-brand" href="1_landing.html">
    <div class="shield">🛡</div>
    SafeStay
  </a>
  <div class="nav-lang">🌐 English ▾</div>
</nav>

<div class="auth-wrap">

  <div class="auth-logo">
    <div class="shield-lg">🛡️</div>
    <h1>Welcome Back! 👋</h1>
    <p>Login to continue</p>
  </div>

  <div class="auth-tabs">
    <div class="auth-tab active" id="tab-login" onclick="switchTab('login')">Login</div>
    <div class="auth-tab" id="tab-register" onclick="switchTab('register')">Register</div>
  </div>

  <!-- LOGIN -->
  <div class="login-panel" id="login-panel">
    <div class="form-group">
      <label>Email</label>
      <input type="email" placeholder="Enter your email" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" placeholder="Enter your password" />
      <div class="form-hint"><a href="#">Forgot password?</a></div>
    </div>
    <button class="btn-submit" onclick="location.href='describe.html'">Login</button>
    <div class="divider">or continue with</div>
    <button class="social-btn">🔵 Continue with Google</button>
    <button class="social-btn">⚫ Continue with Apple</button>
    <div class="auth-footer">
      Don't have an account? <a onclick="switchTab('register')">Register</a>
    </div>
  </div>

  <!-- REGISTER -->
  <div class="register-panel" id="register-panel">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" placeholder="Enter your full name" />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" placeholder="Enter your email" />
    </div>
    <div class="form-group">
      <label>University</label>
      <input type="text" placeholder="e.g. James Cook University" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" placeholder="Create a password" />
    </div>
    <button class="btn-submit" onclick="location.href='describe.html'">Create Account</button>
    <div class="divider">or continue with</div>
    <button class="social-btn">🔵 Continue with Google</button>
    <div class="auth-footer">
      Already have an account? <a onclick="switchTab('login')">Login</a>
    </div>
  </div>

</div>

<script>
  function switchTab(tab) {
    const loginPanel    = document.getElementById('login-panel');
    const registerPanel = document.getElementById('register-panel');
    const tabLogin      = document.getElementById('tab-login');
    const tabRegister   = document.getElementById('tab-register');

    if (tab === 'login') {
      loginPanel.classList.remove('hidden');
      registerPanel.classList.remove('active');
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      document.querySelector('.auth-logo h1').textContent = 'Welcome Back! 👋';
      document.querySelector('.auth-logo p').textContent  = 'Login to continue';
    } else {
      loginPanel.classList.add('hidden');
      registerPanel.classList.add('active');
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      document.querySelector('.auth-logo h1').textContent = 'Create Account 🎓';
      document.querySelector('.auth-logo p').textContent  = 'Join SafeStay today';
    }
  }
</script>
</body>
</html>
